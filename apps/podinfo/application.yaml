apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: arvelov-gitops-demo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/stefanprodan/charts
    chart: podinfo
    targetRevision: 6.17.0
    helm:
      releaseName: podinfo 
      valuesObject:
        replicaCount: 1
        ui:
          message: arvelov-gitops-demo
          color: "#2f4f4f"
          logo: "https://raw.githubusercontent.com/udjin-arvel/arvelov-landing/refs/heads/master/public/favicon.svg?token=GHSAT0AAAAAAEJV53AXLHK6EBHQZBEUBTQ22XLE6YA" 
        service:
          type: NodePort
          nodePort: 30080
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
